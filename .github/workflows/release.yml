# Every push to main builds CutVR.app and publishes it as a GitHub release.
# The app's built-in updater downloads CutVR.zip from the latest release; CutVR.dmg is for new installs.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: version = 1.0.<commit count>

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent dist/CutVR.app CutVR.zip
          # Disk image with an Applications shortcut for drag-and-drop install.
          mkdir dmg
          ditto dist/CutVR.app dmg/CutVR.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname CutVR -srcfolder dmg -ov -format UDZO -fs APFS CutVR.dmg
          hdiutil verify CutVR.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/CutVR.app/Contents/Info.plist)
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## What's new"
            if [ -n "$PREV" ]; then git log --format='- %s' "$PREV..HEAD"; else git log --format='- %s'; fi
            echo
            echo "**Install:** download CutVR.dmg, open it and drag CutVR to Applications (or unzip CutVR.zip), then \`brew install ffmpeg exiftool\`."
            echo "Already installed? Use **CutVR → Check for Updates…**"
          } > notes.md
          gh release create "v$VERSION" CutVR.dmg CutVR.zip --title "CutVR $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
