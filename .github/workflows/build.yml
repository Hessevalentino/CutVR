# Build check only. Releases are signed, notarized and published locally with ./release-signed.sh --publish,
# because the Developer ID certificate lives in the maintainer's keychain, not in CI.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: version = 1.0.<commit count>
      - name: Build
        run: ./build.sh
